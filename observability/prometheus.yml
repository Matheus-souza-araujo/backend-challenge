global:
  # Intervalo curto: o dashboard é de demonstração e precisa reagir rápido
  # quando o gerador de carga roda.
  scrape_interval: 5s
  evaluation_interval: 15s

scrape_configs:
  - job_name: wagering-app
    metrics_path: /metrics
    # O serviço `app` publica a porta 3000 em porta efêmera do host, então não
    # há alvo fixo. O DNS embutido do Docker resolve o nome do serviço para os
    # IPs de TODAS as réplicas — é assim que `--scale app=3` vira 3 targets.
    dns_sd_configs:
      - names: ['app']
        type: A
        port: 3000
        refresh_interval: 10s

  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
