server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    # Descobre os containers do compose pelo socket do Docker e lê o stdout de
    # cada um — nenhuma mudança de logging driver é necessária.
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s

    relabel_configs:
      # Nome do serviço no compose vira label `service` (app, postgres, ...).
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: 'service'
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'container'
      # Só interessam os containers deste projeto.
      - source_labels:
          ['__meta_docker_container_label_com_docker_compose_project']
        regex: 'backend-challenge-junglegaming'
        action: 'keep'

    pipeline_stages:
      # Os logs do app são JSON do pino; os demais containers não são — o
      # `drop_malformed: false` deixa as linhas não-JSON passarem intactas.
      - json:
          expressions:
            level: level
            msg: msg
            correlationId: correlationId
            transactionId: transactionId
            walletId: walletId
            providerId: providerId
            messageId: messageId
            context: context
            time: time
      # `level` como label permite filtrar erros sem varrer o conteúdo.
      - labels:
          level:
      - timestamp:
          source: time
          format: UnixMs
          action_on_failure: skip
